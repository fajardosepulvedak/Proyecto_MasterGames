<html>
<head>
  <style>
            fieldset{
       border-color:#2A0C3D;
       background: linear-gradient(#323243,black);
       border-width:15px;
       width:40%;
        }
    legend{
        font-size:24px;
        font-family:Gill Sans;
        font-style:italic;
        font-weight:bold;
        background-color:black;
        color:white;
        }
    form{
        font-size:16px;
        font-family:Lucida Sans;
        font-style:italic;
        font-weight:bold;
        color:white;
        }
     input{
         font-size:14px;
         font-family:Lucida Sans;
         border-radius:10px;
         border-color:#2A0C3D;
         color:white;
         background-color: transparent;
         border-width: 5px;
            }
     select{
         font-size:14px;
         font-family:Tahoma;
         border-radius:10px;
         border-color:#323243;
         }
    body{
        color:white;   
        font-size:28px;
              }
   button{ 
          size:28px;
         font-size:18px;
         font-family:Comic Sans MS;
         border-radius:10px;
         border-color:#311B3E;
         background:linear-gradient(#311B3E,black);
         color:white;
         }
         
        </style>
</head>
<body>
<center>
<fieldset>
<legend>
COSTO DE ENVIO DEL PAQUETE
</legend>
Producto<br><br>
Anchura: <input type='number' id='anchura'
placeholder='Centimetros' /><br><br>
Largo: <input type='number' id='largo'
placeholder='Centimetros' /><br><br>
Altura: <input type='number' id='altura'
placeholder='Centimetros'><br><br>
Peso: <input type='number' id='peso' placeholder='Kilogramos (Maximo 20Kg)'><br><br>
<button onclick='Precio ()'>Calcular</button> <button onclick='Borrar()'>Borrar</button><br><br>
Peso Mayor: <input type='number' id='pesoMay' disabled style="width:120px"/><br><br>
Precio: <input type='number' id='precio' style="width:120px" disabled/><br><br>
<button onclick="location.assign('IN.html');window.close();">Regresar</button>
</fieldset>
</center>
</body>

<script type='text/Javascript'>
var ancho, pv, largo, altura, precio, volumen, peso, V; 
ancho=document.getElementById("anchura"); 
largo=document.getElementById("largo");
altura=document.getElementById("altura");
peso=document.getElementById("peso");

function Precio(){
volumen=ancho.value*largo.value*altura.value;
pv=volumen/5000; 
pv=parseFloat(pv);

if(peso.value<=pv) {
v=pv;
document.getElementById("pesoMay").value=v;
}

else{
v=peso.value;
document.getElementById("pesoMay").value=v;
} 

v=parseFloat(v);
if (v>0&&v<=0.5){
precio="100"
precio=parseFloat(precio);
document.getElementById("precio").value=precio;
} 

if (v>0.5&&v<=1){
precio="120"
precio=parseFloat(precio);
document.getElementById("precio").value=precio;
}

if (v>1&&v<=2){
precio="140"
precio=parseFloat(precio);
document.getElementById("precio").value=precio;
} 

if (v>2&&v<=4) {
precio="180"
document.getElementById("precio").value=precio;
}

if (v>4&&v<=6) { 
precio="200"
document.getElementById("precio").value=precio;
} 

if (v>6&&v<=8) {
precio="220"
precio=parseFloat(precio);
document.getElementById("precio").value=precio;
}

if (v>8&&v<=10){
precio="245"
precio=parseFloat(precio);
document.getElementById("precio").value=precio;
}

if (v>10&&v<=12) {
precio="300"
precio=parseFloat(precio);
document.getElementById("precio").value=precio;
}

if (v>12 &&v<=14) { 
precio="330"
precio=parseFloat(precio);
document.getElementById("precio").value=precio;
} 

if (v>14&&v<=20) {
precio="500"
precio=parseFloat(precio);
document.getElementById("precio").value=precio;
}

if(v>20){
alert("EL PESO DEBE SER MENOR DE 20KG!!");
}

}

function Borrar(){
document.getElementById("precio").value="";
document.getElementById("peso").value="";
document.getElementById("pesoMay").value="";
document.getElementById("anchura").value="";
document.getElementById("largo").value="";
document.getElementById("altura").value="";
}

</script>
</html>
